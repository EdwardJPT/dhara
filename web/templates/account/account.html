{{define "account"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Account | Dhara</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A project-centric task management app">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.ico">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"></script>
</head>

<body class="flex min-h-screen flex-col items-center bg-linear-to-tl from-[#daddff] to-[#e0f2fe]">
  {{template "nav" .}}

  <div class="min-h-[calc(100vh-7.5rem)] -mt-15 flex items-center justify-center">
    <div
      class="bg-white w-full max-w-3xl rounded-2xl shadow-xl overflow-hidden border border-gray-100 transition-all duration-300 hover:shadow-2xl">

      <div class="h-32 sm:h-48 bg-background relative">
        <div class="absolute inset-0 bg-linear-to-b from-black/10 to-transparent"></div>
      </div>

      <div class="px-6 sm:px-10 pb-10">

        <div class="flex flex-col sm:flex-row justify-between items-center sm:items-end -mt-16 sm:-mt-20 mb-8 sm:mb-6">

          <div
            class="relative z-10 w-32 h-32 sm:w-40 sm:h-40 bg-white rounded-full p-1.5 shadow-lg border border-gray-100">
            <div class="w-full h-full bg-gray-100 rounded-full flex items-center justify-center overflow-hidden">
              <svg class="w-20 h-20 text-gray-400 mt-4" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
            </div>
          </div>

          <div class="mt-4 sm:mt-0 sm:mb-2 w-full sm:w-auto">
            <button hx-get="/account/form" hx-target="#form-container" hx-swap="innerHTML"
              class="w-full cursor-pointer sm:w-auto flex items-center justify-center gap-2 bg-background hover:bg-[#134d64] text-white px-6 py-2.5 rounded-lg font-medium shadow-md shadow-primary/20 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                </path>
              </svg>
              Edit Profile
            </button>
          </div>
        </div>

        <div class="text-center sm:text-left mb-10">
          <h1 id="username" class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Dhara Username</h1>
          <div class="mt-2 flex items-center justify-center sm:justify-start text-gray-500">
            <svg class="w-5 h-5 mr-2 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
              </path>
            </svg>
            <span id="user-email-span" class="text-[15px]">email@dhara.work</span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 border-t border-gray-100 pt-8">

          <div
            class="group bg-white border border-gray-100 rounded-xl p-5 flex items-start gap-4 shadow-sm hover:border-primary/30 hover:shadow-md transition-all duration-200">
            <div class="bg-gray-50 p-3 rounded-lg group-hover:bg-background/5 transition-colors duration-200">
              <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Account Created</h3>
              <p id="created-date" class="text-gray-900 font-medium text-lg mt-1">Jan 15, 2024</p>
              <p id="created-utc" class="text-sm text-gray-400 mt-0.5 font-mono">14:30:00 UTC</p>
            </div>
          </div>

          <div
            class="group bg-white border border-gray-100 rounded-xl p-5 flex items-start gap-4 shadow-sm hover:border-primary/30 hover:shadow-md transition-all duration-200">
            <div class="bg-gray-50 p-3 rounded-lg group-hover:bg-background/5 transition-colors duration-200">
              <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">
                Last Login
              </h3>
              <p id="last-login-date" class="text-gray-900 font-medium text-lg mt-1">Feb 28, 2026</p>
              <p id="last-login-utc" class="text-sm text-gray-400 mt-0.5 font-mono">16:40:56 WIB</p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div id="form-container" class="flex items-center justify-center"></div>
  </div>

  {{template "footer" .}}

  <script>
    // Data from Go backend, the the default of the value is empty array
    window.user = JSON.parse(`{{.UserJSON}}`);
    // Wait for the DOM to be fully loaded before running the script
    document.addEventListener("DOMContentLoaded", (event) => {
      // Retrieve data from window.appData
      const userData = window.user;

      const dateOptions = {year: "numeric", month: "long", day: "numeric"};

      const createdDate = new Date(userData.created_at);
      const formattedCreatedDate = createdDate.toLocaleDateString("en-US", dateOptions);
      // the data from the back end is already in UTC
      const hoursCreatedDate = createdDate.getHours().toString().padStart(2, "0");
      const minutesCreatedDate = createdDate.getMinutes().toString().padStart(2, "0");
      const secondsCreatedDate = createdDate.getSeconds().toString().padStart(2, "0");
      const createdUTC = `${hoursCreatedDate}:${minutesCreatedDate}:${secondsCreatedDate} UTC`;

      const lastLogin = new Date(userData.login_timestamp);
      const formattedLastLogin = lastLogin.toLocaleDateString("en-US", dateOptions);
      // the data from the back end is already in UTC
      const hoursLastLogin = lastLogin.getHours().toString().padStart(2, "0");
      const minutesLastLogin = lastLogin.getMinutes().toString().padStart(2, "0");
      const secondsLastLogin = lastLogin.getSeconds().toString().padStart(2, "0");
      const lastLoginUTC = `${hoursLastLogin}:${minutesLastLogin}:${secondsLastLogin} UTC`;

      // Get the target HTML elements
      const username = document.getElementById("username");
      const emailSpan = document.getElementById("user-email-span");
      const createdDateSpan = document.getElementById("created-date");
      const createdUTCSpan = document.getElementById("created-utc");
      const lastLoginSpan = document.getElementById("last-login-date");
      const lastLoginUTCSpan = document.getElementById("last-login-utc");

      username.textContent = userData.username;
      emailSpan.textContent = userData.email;
      createdDateSpan.textContent = formattedCreatedDate;
      createdUTCSpan.textContent = createdUTC;
      lastLoginSpan.textContent = formattedLastLogin;
      lastLoginUTCSpan.textContent = lastLoginUTC;
    });
  </script>

</body>

</html>
{{end}}
