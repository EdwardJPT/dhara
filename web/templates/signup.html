{{define "signup"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Sign Up | Dhara</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A project-centric task management app">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.ico">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body class="flex flex-col items-center bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen pt-15">
  <div class="w-9/10 max-w-md md:w-full pb-10">

    <!-- Logo/Brand -->
    <div class="mb-8 text-center">
      <div
        class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-xl border-2 border-background bg-white shadow-sm">
        <img src="/static/images/logo.png" alt="Dhara logo" class="">
      </div>
      <h1 class="text-3xl font-bold text-gray-800">Welcome!</h1>
      <p class="mt-2 text-gray-600">Sign up for your new account</p>
      {{ if eq .Message "" }}
      <p></p>
      {{ else }}
      <p class="my-2 text-white bg-hover py-2 text-base w-full text-center font-bold rounded-lg shadow-sm">
        {{ .Message }}
      </p>
      {{ end }}
    </div>

    <!-- Unified Sign Up Card -->
    <div class="overflow-hidden rounded-2xl bg-white shadow-xl transition-all duration-300 hover:shadow-2xl">
      <form action="/signup" method="POST" id="form" class="p-8">
        <!-- Username Input -->
        <div class="mb-6">
          <label for="username" class="mb-2 block text-sm font-medium text-gray-700">Username</label>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <i class="fas fa-user text-gray-400"></i>
            </div>
            <input type="username" id="username" placeholder="username" name="username"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-10 transition focus:border-background focus:ring-1 focus:ring-background focus:outline-none"
              required>
          </div>
        </div>

        <!-- Email Input -->
        <div class="mb-6">
          <label for="email" class="mb-2 block text-sm font-medium text-gray-700">Email</label>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <i class="fas fa-envelope text-gray-400"></i>
            </div>
            <input type="email" id="email" placeholder="user@email.com" name="email"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-10 transition focus:border-background focus:ring-1 focus:ring-background focus:outline-none"
              required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-6">
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          </div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <i class="fas fa-key text-gray-400"></i>
            </div>
            <input type="password" minlength="8" id="password" placeholder="••••••••" name="password"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-10 transition focus:border-background focus:ring-1 focus:ring-background focus:outline-none"
              required>
          </div>
        </div>

        <!-- Confirm Password Input -->
        <div class="mb-6">
          <div class="mb-2 flex items-center justify-between">
            <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
          </div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <i class="fas fa-key text-gray-400"></i>
            </div>
            <input type="password" minlength="8" id="confirm_password" placeholder="••••••••" name="confirm_password"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-10 transition focus:border-background focus:ring-1 focus:ring-background focus:outline-none"
              required>
          </div>
        </div>

        <!-- Error Message -->
        <div id="error-message"
          class="text-white bg-red-500 rounded-lg py-2 text-base mb-6 w-full text-center font-bold shadow-sm"
          style="display: none;">Passwords do not match!</div>

        <!-- Sign Up Button -->
        <button type="submit"
          class="w-full rounded-lg bg-background px-4 py-3 font-medium text-white shadow-md hover:bg-hover focus:ring-2 focus:ring-background focus:ring-offset-2 focus:outline-none">
          Sign Up
        </button>
      </form>

      <!-- Divider (Now inside the card) -->
      <div class="bg-gray-50 px-8 py-4 border-t border-gray-100">
        <div class="flex items-center">
          <div class="grow border-t border-gray-300"></div>
          <span class="mx-4 shrink text-sm text-gray-500">or try it out</span>
          <div class="grow border-t border-gray-300"></div>
        </div>
      </div>

      <!-- Demo Link (Now inside the card) -->
      <div class="bg-gray-50 px-8 pb-8 pt-2">
        <a href="/demo"
          class="flex w-full items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 transition hover:bg-gray-100 hover:text-background shadow-sm">
          <i class="fas fa-compass mr-2 text-blue-500"></i>
          <span class="text-gray-700 font-medium">Explore Demo</span>
        </a>
      </div>
    </div> <!-- End of Unified Card -->

    <!-- Sign In Link -->
    <div class="mt-8 text-center">
      <p class="text-gray-600">
        Already have an account?
        <a href="/" class="font-bold text-background transition hover:text-background/80">Sign in</a>
      </p>
    </div>
  </div>

  {{template "footer" .}}
</body>

<script>
  // Function to check if passwords match
  function checkPasswordMatch() {
    // Get the values of the password and confirm password inputs
    var password = document.getElementById("password").value;
    var confirmPassword = document.getElementById("confirm_password").value;

    // Get the error message div element
    var errorMessage = document.getElementById("error-message");

    // Compare the values
    if (password !== confirmPassword && confirmPassword !== "") {
      // If passwords don't match, show the error message
      errorMessage.style.display = "block";
    } else {
      // If passwords match (or confirm is empty), hide the error message
      errorMessage.style.display = "none";
    }
  }

  // Add event listeners to both password fields to check on input
  document.getElementById("password").addEventListener("input", checkPasswordMatch);
  document.getElementById("confirm_password").addEventListener("input", checkPasswordMatch);

  // Optionally, prevent form submission if passwords don't match
  document.getElementById("form").addEventListener("submit", function (event) {
    if (document.getElementById("password").value !== document.getElementById("confirm_password").value) {
      event.preventDefault();  // Prevent form submission
      alert("Passwords do not match!");
    }
  });
</script>

</html>
{{end}}
