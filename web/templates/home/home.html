{{define "home"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Projects Management | Dhara</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A project-centric task management app">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.ico">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"></script>
</head>

<body class="flex min-h-screen flex-col items-center bg-linear-to-tl from-[#daddff] to-[#e0f2fe]">
  {{template "nav" .}}

  <main id="home" class="mt-25 w-full min-h-screen px-4 md:mt-0"></main>

  {{template "footer" .}}

  <script>
    // Data from Go backend, the the default of the value is empty array
    window.projectList = JSON.parse(`{{.ProjectsJSON}}`);
    window.taskList = JSON.parse(`{{.TasksJSON}}`);
    window.unsortedList = JSON.parse(`{{.UnsortedsJSON}}`);
    window.goalList = JSON.parse(`{{.GoalsJSON}}`);
    window.isDemo = JSON.parse(`{{.IsDemo}}`);
  </script>

  <script type="module" src="/static/js/home/home.js"></script>
</body>

</html>
{{end}}
