{{define "index"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Sign In | Dhara</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A project-centric task management app">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.ico">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body class="flex flex-col items-center bg-linear-to-br from-slate-100 to-slate-200 min-h-screen pt-15">
  <div class="w-9/10 max-w-md md:w-full pb-10">
    <!-- Logo/Brand -->
    <div class="mb-8 text-center">
      <div
        class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-xl border-2 border-background bg-white shadow-sm">
        <img src="/static/images/logo.png" alt="Dhara logo" class="">
      </div>
      <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
      <p class="mt-2 text-gray-600">Sign in to your account</p>
      {{ if eq .Message "" }}
      <p></p>
      {{ else }}
      <p class="my-2 text-white bg-hover py-2 text-base w-full text-center font-bold rounded-lg shadow-sm">
        {{ .Message }}
      </p>
      {{ end }}
    </div>

    <!-- Unified Login Card -->
    <div class="overflow-hidden rounded-2xl bg-white shadow-xl transition-all duration-300 hover:shadow-2xl">

      <!-- Main Form Area -->
      <form action="/" method="POST" id="form" class="p-8">
        <!-- Username Input -->
        <div class="mb-6">
          <label for="username" class="mb-2 block text-sm font-medium text-gray-700">Username</label>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <img src="/static/images/user.svg" alt="user icon" class="opacity-50 h-5 w-5 md:flex">
            </div>
            <input type="username" id="username" placeholder="username" name="username"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-10 transition focus:border-background focus:ring-1 focus:ring-background focus:outline-none"
              required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-6">
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-sm text-background transition hover:text-background/80">Forgot password?</a>
          </div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <img src="/static/images/key.svg" alt="password icon" class="opacity-40 h-4 w-4 md:flex">
            </div>
            <input type="password" id="password" placeholder="••••••••" name="password"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-10 transition focus:border-background focus:ring-1 focus:ring-background focus:outline-none"
              required>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="mb-6 flex items-center">
          <input id="remember" type="checkbox" name="remember"
            class="h-4 w-4 rounded border-gray-300 text-background focus:ring-background">
          <label for="remember" class="ml-2 block text-sm text-gray-700">Remember me</label>
        </div>

        <!-- Login Button -->
        <button type="submit"
          class="w-full rounded-lg bg-background px-4 py-3 font-medium text-white shadow-md hover:bg-hover focus:ring-2 focus:ring-background focus:ring-offset-2 focus:outline-none">
          Sign In
        </button>
      </form>

      <!-- Divider (Now inside the card) -->
      <div class="bg-gray-50 px-8 py-4 border-t border-gray-100">
        <div class="flex items-center">
          <div class="grow border-t border-gray-300"></div>
          <span class="mx-4 shrink text-sm text-gray-500">or try it out</span>
          <div class="grow border-t border-gray-300"></div>
        </div>
      </div>

      <!-- Demo Link (Now inside the card) -->
      <div class="bg-gray-50 px-8 pb-8 pt-2">
        <a href="/demo"
          class="flex w-full items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 transition hover:bg-gray-100 hover:text-background shadow-sm">
          <i class="fas fa-compass mr-2 text-blue-500"></i>
          <span class="text-gray-700 font-medium">View Demo</span>
        </a>
      </div>
    </div> <!-- End of Unified Card -->

    <!-- Sign Up Link -->
    <div class="mt-8 text-center">
      <p class="text-gray-600">
        Don't have an account?
        <a href="/signup" class="font-bold text-background transition hover:text-background/80">Sign up</a>
      </p>
    </div>

  </div>

  {{template "footer" .}}
</body>

</html>
{{end}}
